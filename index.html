<title>Bub &amp; Burt</title>
<style>
:root {
  color-scheme: light;
  --page: #dfe7ef;      /* frost, from Bub's head */
  --panel: #f9fafc;     /* snow */
  --ink: #26304a;       /* cap ink, from Burt's black cap */
  --ink-soft: #56627b;
  --line: #26304a;
  --depth: #9fb0c6;
  --felt: #e3a33d;      /* felt, from Bub's beak and feet */
  --felt-ink: #3a2410;
  --felt-depth: #b97f2c;
  --btn: #f9fafc;
  --btn-ink: #26304a;
  --pen: #2c3f6b;
  --crayon: #c9482f;
  --tile: #eef2f7;
  --backdrop: rgba(18, 24, 39, .45);
  --px: 3px;
  --pxborder: 0 calc(-1 * var(--px)) 0 0 var(--line), 0 var(--px) 0 0 var(--line), calc(-1 * var(--px)) 0 0 0 var(--line), var(--px) 0 0 0 var(--line);
  --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Nunito", "Quicksand", system-ui, -apple-system, sans-serif;
  --pen-font: "Gaegu", "Chalkboard SE", "Chalkboard", "Comic Neue", "Comic Sans MS", cursive;
  --crayon-font: "Gaegu", "Marker Felt", "Chalkboard SE", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #121827; --panel: #1d2538; --ink: #eef2f8; --ink-soft: #a7b2c6; --line: #070a12; --depth: #070a12;
    --felt: #e9a940; --felt-ink: #2a1a08; --felt-depth: #9c6a1c; --btn: #28314a; --btn-ink: #eef2f8;
    --pen: #b9cdf5; --crayon: #ff8f70; --tile: #161d2e; --backdrop: rgba(0, 0, 0, .55);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; min-height: 100dvh; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--felt); outline-offset: 5px; }
[hidden] { display: none !important; }

.app {
  width: 100%; max-width: 480px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px calc(env(safe-area-inset-bottom, 0px) + 18px);
  display: flex; flex-direction: column; gap: 14px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.title { display: block; height: 21px; width: auto; image-rendering: pixelated; }
.clock {
  appearance: none; background: none; border: 0; padding: 2px 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25; text-align: right;
}
.clock .time { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.clock .wx { font-size: 13px; color: var(--ink-soft); }

.travel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); }
.travel span { flex: 1 1 auto; text-align: center; }
.travel button { appearance: none; border: 0; background: var(--btn); color: var(--btn-ink); padding: 6px 10px; margin: var(--px); font-size: 13px; font-weight: 700; box-shadow: var(--pxborder); cursor: pointer; }

.stage { position: relative; margin: 0 -14px; padding: var(--px) 0; display: flex; justify-content: center; }
#room { display: block; background: #141a2a; box-shadow: var(--pxborder); touch-action: manipulation; cursor: pointer; }
.toast {
  position: absolute; left: 50%; bottom: 16px; width: max-content; max-width: calc(100% - 56px);
  transform: translate(-50%, 6px); opacity: 0; pointer-events: none;
  background: var(--panel); color: var(--ink); padding: 8px 12px; font-size: 14px; line-height: 1.35; font-weight: 600;
  box-shadow: var(--pxborder); transition: opacity .18s ease, transform .18s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.dialog {
  background: var(--panel); padding: 14px 14px 12px; margin: var(--px) var(--px) calc(var(--px) * 3);
  box-shadow: var(--pxborder), 0 calc(var(--px) * 2) 0 0 var(--depth);
}
.line { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.line + .line { margin-top: 12px; }
.line img { width: 44px; height: auto; margin-top: 1px; image-rendering: pixelated; }
.line img.both { width: 74px; }
.line p { margin: 0; font-size: 16.5px; line-height: 1.45; font-weight: 500; text-wrap: pretty; }
.next { margin: 12px 0 0; font-size: 13px; color: var(--ink-soft); }
.letter {
  display: block;
  margin: 0 0 14px; padding: 10px 12px; background: var(--tile); box-shadow: 0 0 0 2px var(--felt);
}
.letter .hand { margin-top: 1px; }
.letter button { display: block; margin: 4px 0 0 auto; appearance: none; border: 0; background: none; padding: 2px 0; font-size: 13px; font-weight: 700; color: var(--ink-soft); cursor: pointer; text-decoration: underline; }

.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.btn {
  appearance: none; border: 0; cursor: pointer; touch-action: manipulation;
  background: var(--btn); color: var(--btn-ink); margin: var(--px) var(--px) calc(var(--px) * 3);
  padding: 10px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 700; line-height: 1.1;
  box-shadow: var(--pxborder), 0 calc(var(--px) * 2) 0 0 var(--depth);
}
.btn:active { transform: translateY(var(--px)); box-shadow: var(--pxborder), 0 var(--px) 0 0 var(--depth); }
.btn.primary { background: var(--felt); color: var(--felt-ink); --depth: var(--felt-depth); }
.btn .ico { display: block; height: 24px; }
.btn .ico svg { display: block; height: 24px; width: auto; }

.install { margin: 0; font-size: 13px; line-height: 1.4; color: var(--ink-soft); text-align: center; }
.install button { appearance: none; border: 0; background: none; padding: 0 0 0 4px; font-weight: 700; color: var(--ink); text-decoration: underline; cursor: pointer; }

.sheet-wrap { position: fixed; inset: 0; z-index: 10; background: var(--backdrop); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: min(480px, 100%); max-height: 84vh; max-height: 84dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--panel); margin: 0 var(--px) calc(env(safe-area-inset-bottom, 0px) + 12px); padding: 16px 16px 22px;
  box-shadow: var(--pxborder); animation: rise .22s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet h2 { margin: 0; font-size: 21px; line-height: 1.2; }
.sheet .sub { margin: 6px 0 16px; font-size: 14px; line-height: 1.4; color: var(--ink-soft); }
.close { appearance: none; border: 0; background: var(--btn); color: var(--btn-ink); padding: 6px 12px; margin: var(--px); font-size: 14px; font-weight: 700; box-shadow: var(--pxborder); cursor: pointer; }
.entry + .entry { margin-top: 16px; }
.when { margin: 0 0 3px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.hand { display: block; }
.crayon-hand { margin-top: 2px; transform: rotate(-1.2deg); transform-origin: left center; }
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.treasure { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px; background: var(--tile); }
.treasure img { width: 40px; height: 40px; image-rendering: pixelated; margin-bottom: 2px; }
.t-name { font-size: 15px; font-weight: 700; }
.treasure .hand { margin: 0 0 2px; }
.t-date { font-size: 12px; color: var(--ink-soft); }
.locked { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.locked img { width: 34px; height: 34px; padding: 5px; background: var(--tile); opacity: .7; image-rendering: pixelated; }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .toast { transition: none; } }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <img id="title" class="title" alt="Bub and Burt">
    <button id="clock" class="clock" type="button" aria-label="Time and weather">
      <span id="clockTime" class="time"></span>
      <span id="clockWx" class="wx"></span>
    </button>
  </header>
  <div id="travel" class="travel" hidden>
    <button type="button" data-step="-1">Earlier</button>
    <span id="travelLabel"></span>
    <button type="button" data-step="1">Later</button>
    <button type="button" data-step="day">Next day</button>
    <button type="button" data-step="0">Back to now</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="room" role="img" aria-label="Bub and Burt at home"></canvas>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <section class="dialog" aria-live="polite">
    <div id="letter" class="letter" hidden><div id="letterText"></div><button type="button" id="letterClose">Close note</button></div>
    <div id="lines"></div>
    <p id="next" class="next"></p>
  </section>
  <nav class="actions" aria-label="Things to do">
    <button type="button" id="btnFish" class="btn primary"><span class="ico" id="icoFish"></span><span>Give fish</span></button>
    <button type="button" id="btnDiary" class="btn"><span class="ico" id="icoDiary"></span><span>Diary</span></button>
    <button type="button" id="btnShelf" class="btn"><span class="ico" id="icoShelf"></span><span>Treasures</span></button>

      if (P.asleep) { st.inter.burt = { kind: 'wiggle', t0: now }; toast(pickR(POKE.burtAsleep)); Sound.sfx('boop'); }
      else if (st.burtTaps.length >= 5) { st.burtTaps = []; st.inter.burt = { kind: 'spin', t0: now, dir }; toast(POKE.burtSpin); Sound.sfx('spin'); }
      else if (!st.inter.burt) { st.inter.burt = { kind: 'fall', t0: now, dir }; toast(pickR(POKE.burtAwake)); Sound.sfx('bonk'); }
    }
  } else if (hit === 'lamp') {
    const wasOn = st.env && st.env.lamp > 0;
    Sound.sfx('click');
    if (wasOn) {
      st.lamp = false;
      if (st.env.night > 0.4) { toast('Lamp off. It’s very dark in here.'); setTimeout(() => { st.lamp = null; toast(POKE.lampOff); }, 2600); }
      else toast('Lamp off.');
    } else { st.lamp = true; toast(POKE.lampOn); }
  } else if (hit === 'fridge') toast(POKE.fridge);
  else if (hit === 'shelf') openShelf();
  else if (hit === 'window') toast(POKE.window[st.scene.c.weather] || POKE.window.clear);
});

/* ---------- fish ---------- */
async function giveFish() {
  if (st.snack) return;
  let rec = (await Store.get('bb:snacks')) || {};
  if (rec.id !== st.sceneId) rec = { id: st.sceneId, n: 0 };
  if (rec.n >= 3) { toast(SNACK_MORE); return; }
  rec.n++; await Store.set('bb:snacks', rec);
  const asleep = st.poses && st.poses[0].asleep && st.poses[1].asleep;
  st.snack = { t0: st.tAbs };
  toast(asleep ? SNACK_ASLEEP : SNACK_LINES[rec.n - 1]);
  Sound.sfx('plop');
  const saved = (await Store.get('bb:saved')) || { n: 0, at: 0 };
  saved.n++; saved.at = Date.now() + st.offsetMs;
  await Store.set('bb:saved', saved);
}
async function checkLetter() {
  const saved = await Store.get('bb:saved');
  if (!saved || !saved.n || Date.now() + st.offsetMs - saved.at < 2 * 3600 * 1000) return;
  const msg = saved.n === 1
    ? 'While you were away, Bub finally ate the fish you gave him. He waited exactly the right amount of time.'
    : 'While you were away, Bub finally ate the ' + saved.n + ' fish you gave him. One at a time, with long, thoughtful pauses.';
  const box = $('letterText'); box.textContent = ''; box.append(handEl(msg, 'pen'));
  $('letter').hidden = false; renderHands(box);
  await Store.set('bb:saved', { n: 0, at: 0 });
}

/* ---------- sheets ---------- */
let lastFocus = null;
function showSheet(id) { lastFocus = document.activeElement; $(id).hidden = false; $(id).querySelector('.close').focus(); }
function hideSheet(id) { $(id).hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function hourLabel(b) { const h = b * HPU; return h === 0 ? 'Midnight' : h === 12 ? 'Noon' : (h % 12) + (h < 12 ? ' AM' : ' PM'); }
function openDiary() {
  const now = curNow(), k = keyOf(now), list = diaryEntries(k, blockOfDate(now), 6), body = $('diaryBody');
  body.textContent = '';
  list.forEach((e, i) => {
    const art = el('article', 'entry');
    art.append(el('h3', 'when', i === 0 ? 'Now' : (e.key === k ? '' : 'Yesterday, ') + hourLabel(e.block)), handEl(e.pen, 'pen'));
    if (e.crayon) art.append(handEl(e.crayon, 'crayon'));
    body.append(art);
  });
  showSheet('diaryWrap'); renderHands(body);
}
function openShelf() {
  const now = curNow(), list = foundList(keyOf(now), blockOfDate(now)), grid = $('shelfGrid');
  $('shelfCount').textContent = list.length + ' of ' + TREASURES.length + ' found. Burt finds something new every few days.';
  grid.textContent = '';
  for (let i = list.length - 1; i >= 0; i--) {
    const f = list[i], li = el('li', 'treasure'), im = el('img'), q = parseKey(f.key);
    im.src = treasureURL(f.item); im.alt = '';
    li.append(im, el('span', 't-name', f.item.name), handEl(f.item.note, 'crayon', 8.6),
      el('span', 't-date', 'Found ' + new Date(q.y, q.m - 1, q.d).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })));
    grid.append(li);
  }
  const rest = TREASURES.length - list.length, lockRow = $('shelfLocked');
  lockRow.textContent = ''; lockRow.setAttribute('aria-label', rest + ' treasures still out there');
  for (let i = 0; i < rest; i++) { const im = el('img'); im.src = LOCKED_URL; im.alt = ''; lockRow.append(im); }
  showSheet('shelfWrap'); renderHands(grid);
}

/* ---------- sound (made on the fly, nothing to download) ---------- */
const Sound = {
  ctx: null, on: false, out: null, timer: 0, next: 0, step: 0, noise: null, rain: null, wind: null, crackle: null, weather: 'clear',
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC(); this.out = this.ctx.createGain(); this.out.gain.value = 0.55; this.out.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2, b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },
  toggle() { if (!this.ensure()) return false; this.on = !this.on; if (this.on) this.start(); else this.stop(); return this.on; },
  start() { this.next = this.ctx.currentTime + 0.1; this.step = 0; clearInterval(this.timer); this.timer = setInterval(() => this.pump(), 120); this.setWeather(this.weather); this.startCrackle(); },
  stop() { clearInterval(this.timer); this.timer = 0; this.stopLoop('rain'); this.stopLoop('wind'); this.stopLoop('crackle'); },
  pump() { const half = 60 / 66 / 2; while (this.next < this.ctx.currentTime + 0.5) { this.playStep(this.step, this.next); this.next += half; this.step++; } },
  freq(n) { return 440 * Math.pow(2, (n - 69) / 12); },
  playStep(s, t) {
    const CH = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]], bar = Math.floor(s / 8) % 4;
    if (s % 8 === 0) { for (const n of CH[bar]) this.pad(n, t, 3.6); this.pluck(CH[bar][0] - 12, t, 0.06); }
    const PENT = [72, 74, 76, 79, 81, 84];
    if (hash2(s, 77) < 0.4) this.pluck(PENT[Math.floor(hash2(s, 78) * PENT.length)], t, 0.05);
  },
  pad(n, t, dur) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = this.freq(n); f.type = 'lowpass'; f.frequency.value = 900;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.026, t + 0.6); g.gain.setValueAtTime(0.026, t + dur - 0.9); g.gain.linearRampToValueAtTime(0, t + dur + 0.6);
    o.connect(f); f.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + 0.7);
  },
  pluck(n, t, vol) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = this.freq(n);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0008, t + 1.4);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + 1.5);
  },
  loop(type, freq, q, vol) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; s.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.out); s.start();
    return s;
  },
  stopLoop(k) { if (this[k]) { try { this[k].stop(); } catch (e) { /* already stopped */ } this[k] = null; } },
  setWeather(w) {
    this.weather = w;
    if (!this.on || !this.ctx) return;
    this.stopLoop('rain'); this.stopLoop('wind');
    if (w === 'rain') this.rain = this.loop('bandpass', 1400, 0.5, 0.07);
    if (w === 'snow') this.wind = this.loop('lowpass', 380, 0.7, 0.05);
  },
  startCrackle() {
    this.stopLoop('crackle');
    const c = this.ctx, len = c.sampleRate * 3, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() < 0.0006 ? (Math.random() * 2 - 1) * 0.8 : 0;
    const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    s.buffer = b; s.loop = true; f.type = 'highpass'; f.frequency.value = 1500; g.gain.value = 0.12;
    s.connect(f); f.connect(g); g.connect(this.out); s.start();
    this.crackle = s;
  },
  sfx(kind) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    const P = { boop: ['sine', 660, 990, 0.09, 0.18], bonk: ['triangle', 260, 110, 0.12, 0.25], plop: ['sine', 700, 300, 0.1, 0.2],
      spin: ['triangle', 300, 1200, 0.08, 0.5], click: ['square', 1200, 900, 0.03, 0.05] }[kind] || ['sine', 600, 600, 0.05, 0.1];
    o.type = P[0]; o.frequency.setValueAtTime(P[1], t); o.frequency.exponentialRampToValueAtTime(P[2], t + P[4]);
    g.gain.setValueAtTime(P[3], t); g.gain.exponentialRampToValueAtTime(0.0005, t + P[4] + 0.05);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + P[4] + 0.1);
  }
};

/* ---------- wiring ---------- */
$('title').src = (function () {
  const ink = hex('#26304a'), a = 'BUB', b = 'BURT', w = textWidth(a) + textWidth(b) + 12, buf = new Uint32Array(w * 7);
  target(buf, w, 7); text(a, 1, 1, C.beak, ink); spriteOutlined(SPR.heart, SPAL.heart, textWidth(a) + 3, 1, ink); text(b, textWidth(a) + 10, 1, C.beak, ink);
  target(FRAME, W, H); return bufToURL(buf, w, 7, 3);
})();
$('icoFish').innerHTML = SVG.fish; $('icoDiary').innerHTML = SVG.diary; $('icoShelf').innerHTML = SVG.shelf; $('icoSound').innerHTML = SVG.soundOff;
$('btnFish').addEventListener('click', giveFish);
$('btnDiary').addEventListener('click', openDiary);
$('btnShelf').addEventListener('click', openShelf);
$('btnSound').addEventListener('click', () => {
  const on = Sound.toggle();
  $('btnSound').setAttribute('aria-pressed', on ? 'true' : 'false');
  $('icoSound').innerHTML = on ? SVG.soundOn : SVG.soundOff;
  toast(on ? 'Sound on. If you can’t hear it, check that your phone isn’t on silent.' : 'Sound off.');
});
$('letterClose').addEventListener('click', () => { $('letter').hidden = true; });
document.querySelectorAll('.sheet-wrap').forEach(w => {
  w.addEventListener('click', e => { if (e.target === w) hideSheet(w.id); });
  w.querySelector('.close').addEventListener('click', () => hideSheet(w.id));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.sheet-wrap:not([hidden])').forEach(w => hideSheet(w.id)); });
let clockTaps = [];
$('clock').addEventListener('click', () => {
  const n = performance.now(); clockTaps = clockTaps.filter(x => n - x < 900); clockTaps.push(n);
  if (clockTaps.length >= 3) { clockTaps = []; $('travel').hidden = !$('travel').hidden; updateClock(curNow()); }
});
$('travel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const step = b.dataset.step;
  st.offsetMs = step === '0' ? 0 : st.offsetMs + (step === 'day' ? 86400000 : +step * HPU * 3600000);
  updateClock(curNow()); checkLetter();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (Sound.ctx) Sound.ctx.suspend(); }
  else { if (Sound.ctx && Sound.on) Sound.ctx.resume(); checkLetter(); }
});
(function installHint() {
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (!ios || standalone || framed) return;
  Store.get('bb:hint').then(v => { if (!v) $('install').hidden = false; });
  $('installClose').addEventListener('click', () => { $('install').hidden = true; Store.set('bb:hint', 1); });
})();
resize();
window.addEventListener('resize', resize);
checkLetter();
requestAnimationFrame(tick);

})();
</script>
